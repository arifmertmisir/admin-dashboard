<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-top">
                <span class="mdi mdi-view-dashboard"></span>
                <a href="#">Dashboard</a>
            </div>
            <div class="sidebar-center">
                <ul>
                    <li><span class="mdi mdi-home"></span>Home</li>
                    <li><span class="mdi mdi-card-account-details-outline"></span>Profile</li>
                    <li><span class="mdi mdi-message-reply"></span>Messages</li>
                    <li><span class="mdi mdi-history"></span>History</li>
                    <li><span class="mdi mdi-clipboard-list"></span>Tasks</li>
                    <li><span class="mdi mdi-account-group"></span>Communities</li>
                </ul> 
            </div>
            <div class="sidebar-bottom">
                <ul>
                    <li><span class="mdi mdi-cog"></span>Settings</li>
                    <li><span class="mdi mdi-help-box"></span>Support</li>
                    <li><span class="mdi mdi-shield-check"></span>Privacy</li>
                </ul>
            </div>
        </div>
        <div class="header">
            <div class="search-bar">
                <span></span>
                <input type="text">
            </div>
            <div class="user-info">

            </div>
            
            <div class="greeting">

            </div>
            <div class="buttons">

            </div>
        </div>
        <div class="main-content">

        </div>
    </div>
</body>
</html>
